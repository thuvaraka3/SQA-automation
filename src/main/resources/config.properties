# ============================================================
# config.properties - Configuration settings for the project
# ============================================================
# This file stores all the settings our tests need. By keeping
# configuration separate from code, we can change settings without
# touching the Java files.
# ============================================================

# The URL of the website we're testing
base.url=https://www.saucedemo.com

# Which browser to use: "chrome" or "firefox"
browser=chrome

# Username for the demo account (this is Sauce Demo's test account)
username=standard_user

# Password for the demo account
password=secret_sauce

# Maximum wait time in seconds when looking for elements
# If an element doesn't appear within this time, the test fails
timeout=10
